<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Aconchego | Cardápio Digital</title>

  <!-- Fontes do Google: Playfair Display (títulos) e Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Nosso CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>☕ Café Aconchego</h1>
    <p>Seu café, do seu jeito</p>
    <!-- Número da mesa: preenchido pelo JavaScript quando a URL tem ?mesa= -->
    <p id="mesa" class="mesa" hidden></p>
  </header>

  <main>
    <!-- Campo de busca -->
    <input type="search" id="campo-busca" class="busca"
           placeholder="🔍 Buscar no cardápio..."
           aria-label="Buscar no cardápio" autocomplete="off">

    <!-- Botões de categoria: o data-categoria precisa ser igual ao "categoria" do dados.js -->
    <nav class="categorias" aria-label="Categorias do cardápio">
      <button type="button" class="categoria ativa" data-categoria="todos">🍽️ Todos</button>
      <button type="button" class="categoria" data-categoria="cafes">☕ Cafés</button>
      <button type="button" class="categoria" data-categoria="sanduiches">🥪 Sanduíches</button>
      <button type="button" class="categoria" data-categoria="doces">🍰 Doces</button>
      <button type="button" class="categoria" data-categoria="bebidas">🥤 Bebidas</button>
      <button type="button" class="categoria" data-categoria="especiais">🌟 Especiais</button>
    </nav>

    <!-- Os itens do cardápio serão criados aqui pelo JavaScript -->
    <section id="lista-itens"></section>
  </main>

  <!-- Botão flutuante do carrinho: começa escondido (hidden) e aparece quando há itens -->
  <button type="button" id="botao-carrinho" class="botao-carrinho" hidden>
    🛒 Ver carrinho <span id="contador-carrinho" class="contador">0</span>
  </button>

  <!-- Painel do carrinho: <dialog> é uma janela que abre por cima da página -->
  <dialog id="painel-carrinho" class="painel-carrinho" aria-labelledby="titulo-carrinho">
    <div class="painel-cabecalho">
      <h2 id="titulo-carrinho">🛒 Seu pedido</h2>
      <button type="button" id="fechar-carrinho" class="botao-fechar" aria-label="Fechar carrinho">✕</button>
    </div>

    <!-- As linhas do carrinho serão criadas aqui pelo JavaScript -->
    <ul id="lista-carrinho" class="lista-carrinho"></ul>

    <div class="painel-total">
      <span>Total</span>
      <strong id="total-carrinho">R$ 0,00</strong>
    </div>

    <button type="button" id="enviar-pedido" class="botao-enviar">📲 Enviar pedido pelo WhatsApp</button>

    <button type="button" id="esvaziar-carrinho" class="botao-esvaziar">🗑️ Esvaziar carrinho</button>
  </dialog>

  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
