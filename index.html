<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Aconchego | Cardápio Digital</title>
  <meta name="description" content="Cardápio digital de demonstração do Café Aconchego: escolha seus itens, monte o pedido e envie pelo WhatsApp.">
  <meta name="author" content="Harada Tecnologias">

  <!-- Ícone da aba e cor da barra do navegador (Android) -->
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#6c3919">

  <!-- Prévia ao compartilhar o link (WhatsApp, LinkedIn, Facebook...) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://mharada7.github.io/cardapio-digital/">
  <meta property="og:title" content="Café Aconchego | Cardápio Digital">
  <meta property="og:description" content="Escolha seus itens, monte o pedido e envie pelo WhatsApp. Projeto de demonstração em HTML, CSS e JavaScript.">
  <meta property="og:image" content="https://mharada7.github.io/cardapio-digital/img/compartilhar.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Cappuccino com desenho de folha na espuma, sobre pires branco">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fontes do Google: Playfair Display (títulos) e Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Nosso CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>☕ Café Aconchego</h1>
    <p>Seu café, do seu jeito</p>
    <!-- Número da mesa: preenchido pelo JavaScript quando a URL tem ?mesa= -->
    <p id="mesa" class="mesa" hidden></p>
  </header>

  <main>
    <!-- Campo de busca -->
    <input type="search" id="campo-busca" class="busca"
           placeholder="🔍 Buscar no cardápio..."
           aria-label="Buscar no cardápio" autocomplete="off">

    <!-- Botões de categoria: o data-categoria precisa ser igual ao "categoria" do dados.js -->
    <nav class="categorias" aria-label="Categorias do cardápio">
      <button type="button" class="categoria ativa" data-categoria="todos">🍽️ Todos</button>
      <button type="button" class="categoria" data-categoria="cafes">☕ Cafés</button>
      <button type="button" class="categoria" data-categoria="sanduiches">🥪 Sanduíches</button>
      <button type="button" class="categoria" data-categoria="doces">🍰 Doces</button>
      <button type="button" class="categoria" data-categoria="bebidas">🥤 Bebidas</button>
      <button type="button" class="categoria" data-categoria="especiais">🌟 Especiais</button>
    </nav>

    <!-- Os itens do cardápio serão criados aqui pelo JavaScript -->
    <section id="lista-itens"></section>
  </main>

  <footer class="rodape">
    Desenvolvido por
    <a class="rodape-marca" href="https://mharada7.github.io/harada-tecnologias/#cardapios" target="_blank" rel="noopener">Harada Tecnologias<span class="marca-registrada">®</span></a>
  </footer>

  <!-- Botão flutuante do carrinho: começa escondido (hidden) e aparece quando há itens -->
  <button type="button" id="botao-carrinho" class="botao-carrinho" hidden>
    🛒 Ver carrinho <span id="contador-carrinho" class="contador">0</span>
  </button>

  <!-- Painel do carrinho: <dialog> é uma janela que abre por cima da página -->
  <dialog id="painel-carrinho" class="painel-carrinho" aria-labelledby="titulo-carrinho">
    <div class="painel-cabecalho">
      <h2 id="titulo-carrinho">🛒 Seu pedido</h2>
      <button type="button" id="fechar-carrinho" class="botao-fechar" aria-label="Fechar carrinho">✕</button>
    </div>

    <!-- As linhas do carrinho serão criadas aqui pelo JavaScript -->
    <ul id="lista-carrinho" class="lista-carrinho"></ul>

    <div class="painel-total">
      <span>Total</span>
      <strong id="total-carrinho">R$ 0,00</strong>
    </div>

    <!-- Modo retirada: só aparece quando a URL NÃO tem ?mesa= -->
    <div id="dados-retirada" class="dados-retirada" hidden>
      <p>🛍️ Pedido para <strong>retirar no balcão</strong></p>
      <label for="nome-cliente">Seu nome</label>
      <input type="text" id="nome-cliente" class="campo-nome"
             placeholder="Ex.: Maria" autocomplete="given-name" maxlength="40">
      <p id="erro-nome" class="erro" hidden>Digite seu nome para enviar o pedido.</p>
    </div>

    <button type="button" id="enviar-pedido" class="botao-enviar">📲 Enviar pedido pelo WhatsApp</button>

    <button type="button" id="esvaziar-carrinho" class="botao-esvaziar">🗑️ Esvaziar carrinho</button>
  </dialog>

  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
